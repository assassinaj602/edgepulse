name: edgepulse
description: >-
  Flutter plugin for EdgePulse — captures real memory, thermal state,
  battery, and CPU on Android and iOS during on-device AI inference.
version: 0.2.2
homepage: https://github.com/assassinaj602/edgepulse
repository: https://github.com/assassinaj602/edgepulse
issue_tracker: https://github.com/assassinaj602/edgepulse/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

topics:
  - flutter
  - plugin
  - observability
  - performance
  - profiling

flutter:
  plugin:
    platforms:
      android:
        package: io.github.edgepulse
        pluginClass: EdgePulsePlugin
      ios:
        pluginClass: EdgePulsePlugin

dependencies:
  flutter:
    sdk: flutter
  edgepulse_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
