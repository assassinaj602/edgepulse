name: edgepulse_cli
description: >-
  Standalone CLI for EdgePulse — trace on-device AI models and compare
  inference results from any terminal or CI/CD pipeline. No Flutter required.
version: 0.1.0
homepage: https://github.com/assassinaj602/edgepulse
repository: https://github.com/assassinaj602/edgepulse
issue_tracker: https://github.com/assassinaj602/edgepulse/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

topics:
  - cli
  - observability
  - performance
  - profiling
  - developer-tools

dependencies:
  edgepulse_core: ^0.1.0
  args: ^2.4.0
  io: ^1.0.4
  path: ^1.8.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0

executables:
  edgepulse: edgepulse
