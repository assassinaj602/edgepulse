name: Publish Dry-Run

on:
  push:
    branches: [ main, 'feat/*', 'fix/*', 'chore/*', 'ci/*', 'release/*' ]
  pull_request:
    branches: [ main ]

jobs:
  publish-dry-run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Publish Dry-Run (edgepulse_core)
        run: |
          cd packages/edgepulse_core
          dart pub get
          dart pub publish --dry-run

      - name: Publish Dry-Run (edgepulse_cli)
        run: |
          cd packages/edgepulse_cli
          dart pub get
          dart pub publish --dry-run

      - name: Publish Dry-Run (edgepulse)
        run: |
          cd packages/edgepulse
          flutter pub get
          flutter pub publish --dry-run
