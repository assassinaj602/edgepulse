name: Publish Dry-Run

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dry-run-core:
    name: Dry-run publish edgepulse_core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get dependencies
        working-directory: packages/edgepulse_core
        run: dart pub get

      - name: Publish dry-run
        working-directory: packages/edgepulse_core
        run: dart pub publish --dry-run

  dry-run-cli:
    name: Dry-run publish edgepulse_cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get core dependencies
        working-directory: packages/edgepulse_core
        run: dart pub get

      - name: Get cli dependencies
        working-directory: packages/edgepulse_cli
        run: dart pub get

      - name: Publish dry-run
        working-directory: packages/edgepulse_cli
        run: dart pub publish --dry-run
