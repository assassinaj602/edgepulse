name: CI

on:
  push:
    branches: [ main, 'feat/*', 'fix/*', 'chore/*', 'ci/*', 'release/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies (edgepulse_core)
        run: |
          cd packages/edgepulse_core
          dart pub get

      - name: Format check (edgepulse_core)
        run: |
          cd packages/edgepulse_core
          dart format --output=none --set-exit-if-changed .

      - name: Analyze (edgepulse_core)
        run: |
          cd packages/edgepulse_core
          dart analyze --fatal-infos --fatal-warnings

      - name: Run tests (edgepulse_core)
        run: |
          cd packages/edgepulse_core
          dart test

      - name: Install dependencies (edgepulse_cli)
        run: |
          cd packages/edgepulse_cli
          dart pub get

      - name: Format check (edgepulse_cli)
        run: |
          cd packages/edgepulse_cli
          dart format --output=none --set-exit-if-changed .

      - name: Analyze (edgepulse_cli)
        run: |
          cd packages/edgepulse_cli
          dart analyze --fatal-infos --fatal-warnings

      - name: Run tests (edgepulse_cli)
        run: |
          cd packages/edgepulse_cli
          dart test
