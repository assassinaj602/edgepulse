name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: Test edgepulse_core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Dart version
        run: dart --version

      - name: Get dependencies
        working-directory: packages/edgepulse_core
        run: dart pub get

      - name: Verify formatting
        working-directory: packages/edgepulse_core
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: packages/edgepulse_core
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run tests
        working-directory: packages/edgepulse_core
        run: dart test --reporter=expanded

  test-cli:
    name: Test edgepulse_cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Get core dependencies
        working-directory: packages/edgepulse_core
        run: dart pub get

      - name: Get cli dependencies
        working-directory: packages/edgepulse_cli
        run: dart pub get

      - name: Verify formatting
        working-directory: packages/edgepulse_cli
        run: dart format --output=none --set-exit-if-changed lib bin test

      - name: Analyze
        working-directory: packages/edgepulse_cli
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run tests
        working-directory: packages/edgepulse_cli
        run: dart test --reporter=expanded

  guard:
    name: Guard — block merge if required jobs failed
    runs-on: ubuntu-latest
    needs: [test-core, test-cli]
    if: always()
    steps:
      - name: Fail if test-core did not succeed
        if: needs.test-core.result != 'success'
        run: |
          echo "❌ test-core did not succeed: ${{ needs.test-core.result }}"
          exit 1
      - name: Fail if test-cli did not succeed
        if: needs.test-cli.result != 'success'
        run: |
          echo "❌ test-cli did not succeed: ${{ needs.test-cli.result }}"
          exit 1
      - run: echo "✅ All required jobs passed"
